<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#063c72">
  <meta name="description" content="Kalkulator interaktif untuk menghitung harga jual, laba, BEP, dan target penjualan dengan 51 pilihan usaha.">
  <title>SBB — Kalkulator Usaha</title>
  <style>
:root {
  color-scheme: light;
  --navy: #063c72;
  --navy-2: #01427f;
  --blue: #0255a5;
  --blue-2: #0d6ec7;
  --sky: #e8f2fb;
  --canvas: #f4f7fa;
  --cream: #fff4dc;
  --ink: #142538;
  --muted: #66788a;
  --line: #dbe4ec;
  --white: #fff;
  --green: #277557;
  --green-bg: #e6f5ee;
  --amber: #9b6100;
  --amber-bg: #fff2d2;
  --red: #b83a38;
  --red-bg: #fdebea;
  --shadow: 0 16px 36px rgba(6, 60, 114, .08);
}

* { box-sizing: border-box; }

html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  color: var(--ink);
  background: var(--canvas);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, [role="button"] { touch-action: manipulation; }
[hidden] { display: none !important; }

:focus-visible {
  outline: 3px solid rgba(13, 110, 199, .35);
  outline-offset: 2px;
}

h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3, h4 { color: var(--ink); line-height: 1.17; letter-spacing: -.025em; }
h1 { font-size: clamp(1.35rem, 2vw, 1.7rem); }
h2 { margin-bottom: .55rem; font-size: clamp(1.65rem, 3vw, 2.25rem); }
h3 { margin-bottom: .45rem; font-size: 1.15rem; }
h4 { margin-bottom: .35rem; font-size: 1.02rem; }
p { color: var(--muted); }
small { color: var(--muted); }
code { font: 600 .78rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.eyebrow, .breadcrumb {
  margin: 0 0 .38rem;
  color: var(--blue);
  font-size: .71rem;
  font-weight: 800;
  letter-spacing: .13em;
}

.btn {
  min-height: 44px;
  border: 1px solid transparent;
  border-radius: 9px;
  padding: .7rem 1rem;
  font-weight: 750;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}

.btn:hover { transform: translateY(-1px); }
.btn.primary { color: var(--white); background: var(--blue); box-shadow: 0 8px 18px rgba(2, 85, 165, .2); }
.btn.primary:hover { background: var(--navy-2); }
.btn.secondary { color: var(--blue); border-color: #afcce7; background: var(--white); }
.btn.ghost { color: var(--blue); border-color: var(--line); background: #f9fbfd; }
.btn.subtle { color: var(--navy); border-color: #c7dcec; background: var(--white); }
.btn.danger { color: var(--white); background: var(--red); }
.btn.wide { width: 100%; }
.calculator-guest-btn { width: 100%; margin-top: .65rem; color: var(--navy); border: 1px solid #b9d0e4; background: var(--sky); }

/* Access */
.access-gate {
  position: relative;
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 6rem 1.25rem 3rem;
  overflow: hidden;
  background:
    linear-gradient(120deg, rgba(232, 242, 251, .88), rgba(255, 255, 255, .95) 52%, rgba(255, 244, 220, .9)),
    var(--white);
}

.access-gate::before,
.access-gate::after {
  position: absolute;
  content: "";
  width: 34rem;
  height: 34rem;
  border: 1px solid rgba(2, 85, 165, .12);
  transform: rotate(28deg);
  pointer-events: none;
}

.access-gate::before { top: -22rem; right: -10rem; background: rgba(232, 242, 251, .4); }
.access-gate::after { bottom: -25rem; left: -13rem; background: rgba(255, 244, 220, .35); }

.gate-brand {
  position: absolute;
  top: 1.6rem;
  left: clamp(1.25rem, 5vw, 4rem);
  display: flex;
  align-items: center;
  gap: .7rem;
  color: var(--navy);
  font-weight: 850;
  letter-spacing: -.02em;
}

.gate-brand img { width: 42px; height: 42px; object-fit: contain; }

.gate-card {
  position: relative;
  z-index: 1;
  width: min(100%, 530px);
  border: 1px solid #d5e2ec;
  border-top: 4px solid var(--blue);
  border-radius: 14px;
  padding: clamp(1.5rem, 5vw, 2.5rem);
  background: rgba(255, 255, 255, .96);
  box-shadow: 0 24px 60px rgba(6, 60, 114, .13);
}

.prototype-label {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: 1.25rem;
  color: var(--blue);
  font-size: .72rem;
  font-weight: 850;
  letter-spacing: .13em;
}

.prototype-label i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 5px var(--green-bg);
}

.gate-card h1 { margin-bottom: .8rem; font-size: clamp(1.8rem, 5vw, 2.55rem); }
.gate-copy { margin-bottom: 1.7rem; font-size: 1.02rem; }
.gate-card form > label,
.generator-panel label,
.integration-detail > label,
.plan-card > label {
  display: block;
  margin-bottom: .45rem;
  color: #35495e;
  font-size: .86rem;
  font-weight: 750;
}

.code-field { display: grid; grid-template-columns: 1fr auto; gap: .6rem; }
.code-field input { text-transform: uppercase; letter-spacing: .055em; }

input, select, textarea {
  width: 100%;
  min-height: 44px;
  border: 1px solid #c8d5df;
  border-radius: 8px;
  padding: .68rem .78rem;
  color: var(--ink);
  background: var(--white);
  transition: border-color .15s ease, box-shadow .15s ease;
}

textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--blue-2); box-shadow: 0 0 0 3px rgba(13, 110, 199, .12); outline: none; }

.field-error {
  display: block;
  min-height: 1.3rem;
  margin: .35rem 0 0;
  color: var(--red);
  font-size: .82rem;
  font-style: normal;
}

.demo-code {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-top: .75rem;
  border: 1px dashed #bdcfe0;
  border-radius: 9px;
  padding: .7rem .75rem;
  background: var(--sky);
}

.demo-code div { display: grid; }
.demo-code strong { color: var(--navy); font: 750 .86rem/1.4 ui-monospace, monospace; }
.divider { display: flex; align-items: center; gap: .8rem; margin: 1.1rem 0; color: #8593a2; font-size: .78rem; }
.divider::before, .divider::after { height: 1px; flex: 1; content: ""; background: var(--line); }
.google-btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: .7rem; border-color: #cdd7df; background: var(--white); }
.google-btn em { border-radius: 4px; padding: .12rem .35rem; color: var(--amber); background: var(--amber-bg); font-size: .7rem; font-style: normal; }
.google-mark { display: grid; width: 24px; height: 24px; place-items: center; border: 1px solid #d6dce1; border-radius: 50%; color: #4285f4; font-weight: 900; }
.prototype-note { margin: .7rem 0 0; color: #708294; font-size: .78rem; line-height: 1.45; }
.admin-preview { display: block; margin: 1.4rem auto 0; border: 0; padding: .35rem; color: var(--blue); background: transparent; font-size: .86rem; font-weight: 750; cursor: pointer; }
.gate-footer { position: absolute; z-index: 1; bottom: 1.2rem; margin: 0; font-size: .76rem; }

/* Shell */
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  z-index: 30;
  inset: 0 auto 0 0;
  display: flex;
  width: 250px;
  flex-direction: column;
  padding: 1.3rem 1rem;
  color: var(--white);
  background: linear-gradient(180deg, #073e74 0%, #042e58 100%);
  box-shadow: 8px 0 30px rgba(3, 36, 70, .12);
}

.brand { display: flex; align-items: center; gap: .72rem; padding: .25rem .35rem 1.45rem; border-bottom: 1px solid rgba(255,255,255,.12); }
.brand img { width: 43px; height: 43px; object-fit: contain; filter: brightness(0) invert(1); }
.brand div { display: grid; }
.brand strong { font-size: 1.05rem; letter-spacing: -.02em; }
.brand span { color: rgba(255,255,255,.58); font-size: .66rem; letter-spacing: .07em; }
.main-nav { display: grid; gap: .35rem; margin-top: 1.35rem; }
.nav-item {
  display: flex;
  min-height: 45px;
  align-items: center;
  gap: .8rem;
  border: 0;
  border-left: 3px solid transparent;
  border-radius: 6px;
  padding: .72rem .8rem;
  color: rgba(255,255,255,.75);
  background: transparent;
  font-size: .9rem;
  font-weight: 680;
  text-align: left;
  cursor: pointer;
}

.nav-item b { display: grid; width: 22px; place-items: center; font-size: 1.2rem; font-weight: 500; }
.nav-item:hover { color: var(--white); background: rgba(255,255,255,.08); }
.nav-item.is-active { border-left-color: #69b7f8; color: var(--white); background: rgba(255,255,255,.12); }
.sidebar-bottom { display: grid; gap: .7rem; margin-top: auto; }
.license-card { border: 1px solid rgba(255,255,255,.13); border-radius: 9px; padding: .9rem; background: rgba(255,255,255,.06); }
.license-card > small { color: rgba(255,255,255,.52); font-size: .62rem; font-weight: 800; letter-spacing: .13em; }
.license-card > div { display: flex; align-items: center; gap: .45rem; margin: .45rem 0 .18rem; }
.license-card > span { color: rgba(255,255,255,.58); font-size: .7rem; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64d69d; box-shadow: 0 0 0 4px rgba(100,214,157,.12); }

.workspace { min-height: 100vh; margin-left: 250px; }
.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  height: 78px;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-bottom: 1px solid var(--line);
  padding: 0 clamp(1rem, 3vw, 2.2rem);
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(12px);
}

.title-stack h1 { margin: 0; font-size: 1.25rem; }
.breadcrumb { margin-bottom: .15rem; font-size: .61rem; }
.topbar-actions, .user-chip { display: flex; align-items: center; gap: 1rem; }
.prototype-badge { border: 1px solid #d6e1e9; border-radius: 5px; padding: .3rem .48rem; color: var(--muted); background: #f7fafc; font-size: .68rem; font-weight: 750; }
.user-chip { gap: .55rem; }
.user-chip > div { display: grid; }
.user-chip strong { font-size: .83rem; }
.user-chip small { font-size: .69rem; }
.avatar, .person > span {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 50%;
  color: var(--white);
  background: var(--blue);
  font-size: .74rem;
  font-weight: 850;
}

.icon-btn { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--white); cursor: pointer; }
.menu-toggle { display: none; }
main { width: min(100%, 1500px); margin-inline: auto; padding: clamp(1.25rem, 3vw, 2.3rem); }
.page { animation: page-in .2s ease-out; }
@keyframes page-in { from { opacity: 0; transform: translateY(5px); } }

.welcome-row, .module-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  margin-bottom: 1.4rem;
}

.welcome-row p:not(.eyebrow), .module-header p:not(.eyebrow) { max-width: 700px; margin-bottom: 0; }
.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.metric-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.metric-card {
  position: relative;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 1.15rem;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 7px 20px rgba(6,60,114,.035);
}

.metric-card::before { position: absolute; inset: 0 0 auto; height: 3px; content: ""; background: #b9d2e7; }
.metric-card.emphasis { color: var(--white); border-color: var(--navy); background: linear-gradient(135deg, var(--navy), var(--blue)); }
.metric-card.emphasis::before { background: #78c2ff; }
.metric-card > span { display: block; margin-bottom: .7rem; color: var(--muted); font-size: .78rem; font-weight: 700; }
.metric-card > strong { display: block; overflow: hidden; margin-bottom: .32rem; color: var(--ink); font-size: clamp(1.25rem, 2.3vw, 1.75rem); letter-spacing: -.045em; text-overflow: ellipsis; white-space: nowrap; }
.metric-card > small { font-size: .72rem; }
.metric-card.emphasis > span, .metric-card.emphasis > small { color: rgba(255,255,255,.72); }
.metric-card.emphasis > strong { color: var(--white); }

.two-column { display: grid; grid-template-columns: 1.1fr .9fr; gap: 1rem; margin: 1rem 0; }
.panel { border: 1px solid var(--line); border-radius: 11px; padding: clamp(1rem, 2vw, 1.35rem); background: var(--white); box-shadow: 0 8px 24px rgba(6,60,114,.04); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.panel-head h3 { margin: 0; }
.panel > p { margin-bottom: 1rem; }
.signal, .tag, .count-badge, .type-label {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  border-radius: 5px;
  padding: .28rem .46rem;
  color: var(--blue);
  background: var(--sky);
  font-size: .67rem;
  font-weight: 800;
}

.signal.good, .tag.good { color: var(--green); background: var(--green-bg); }
.signal.warning, .tag.warning { color: var(--amber); background: var(--amber-bg); }
.signal.danger, .tag.danger { color: var(--red); background: var(--red-bg); }
.tag.neutral { color: #617385; background: #edf2f5; }
.count-badge { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 50%; padding: 0; }

.action-links { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.action-links button { display: flex; justify-content: space-between; border: 1px solid var(--line); border-radius: 7px; padding: .72rem .8rem; color: var(--navy); background: #f8fbfd; font-weight: 750; cursor: pointer; }
.progress-panel { display: grid; align-content: start; }
.progress-item { margin-bottom: 1rem; }
.progress-item > div:first-child, .distribution > div > span { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .42rem; font-size: .8rem; }
.progress { height: 7px; overflow: hidden; border-radius: 4px; background: #e9eef2; }
.progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--blue); transition: width .25s ease; }
.progress.green i { background: var(--green); }

.connection-panel { margin-top: 1rem; }
.connection-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.connection-grid > div { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .75rem; padding: .9rem; border-bottom: 1px solid var(--line); }
.connection-grid > div:nth-child(odd) { border-right: 1px solid var(--line); }
.connection-grid > div:nth-last-child(-n+2) { border-bottom: 0; }
.connection-grid > div > div { display: grid; }
.connection-grid strong { font-size: .82rem; }
.connection-grid small { font-size: .7rem; }
.connection-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 8px; color: var(--blue); background: var(--sky); font-size: .7rem; font-weight: 900; }
.connection-icon.cloudflare { color: #c75216; background: #fff0e6; }

.month-control { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--white); }
.month-control button { width: 40px; height: 42px; border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; }
.month-control button:hover { background: var(--sky); }
.month-control strong { min-width: 150px; padding: 0 .5rem; text-align: center; font-size: .82rem; text-transform: capitalize; }
.tab-bar { display: flex; gap: .25rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab-bar::-webkit-scrollbar { display: none; }
.tab-bar button { min-height: 42px; flex: 0 0 auto; border: 0; border-bottom: 3px solid transparent; padding: .65rem .85rem; color: var(--muted); background: transparent; font-size: .8rem; font-weight: 750; cursor: pointer; }
.tab-bar button.is-active { border-bottom-color: var(--blue); color: var(--blue); }
.module-tab, .admin-panel { animation: page-in .18s ease; }
.form-panel.narrow { max-width: 820px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.form-grid > label, .readiness-form-panel label {
  display: grid;
  align-content: start;
  gap: .4rem;
  color: #35495e;
  font-size: .82rem;
  font-weight: 730;
}

.form-grid label > small, .plan-card label > small { justify-self: end; margin-bottom: -1.7rem; padding-right: .7rem; pointer-events: none; }
.type-switch { display: flex; gap: .45rem; margin: 0 0 1.1rem; border: 0; padding: 0; }
.type-switch legend { margin-bottom: .6rem; color: #35495e; font-size: .82rem; font-weight: 730; }
.type-switch label { position: relative; }
.type-switch input { position: absolute; opacity: 0; pointer-events: none; }
.type-switch span { display: block; min-width: 90px; border: 1px solid var(--line); border-radius: 7px; padding: .55rem .75rem; color: var(--muted); background: #f8fafc; text-align: center; cursor: pointer; }
.type-switch input:checked + span { border-color: var(--blue); color: var(--blue); background: var(--sky); font-weight: 800; }
.form-actions { display: flex; justify-content: flex-end; gap: .7rem; margin-top: 1.2rem; }
.empty-state { padding: 2rem 1rem; color: var(--muted); text-align: center; font-size: .84rem; }
.empty-state.compact { padding: .6rem 0; text-align: left; }
.overspent-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.overspent-row:last-child { border-bottom: 0; }
.overspent-row div { display: grid; }
.overspent-row strong { font-size: .84rem; }
.overspent-row small { font-size: .72rem; }
.overspent-row > span { color: var(--red); font-size: .78rem; font-weight: 800; }

.budget-layout { grid-template-columns: .75fr 1.25fr; align-items: start; }
.allocation-summary > div { display: flex; align-items: center; justify-content: space-between; min-height: 46px; border-bottom: 1px solid var(--line); font-size: .82rem; }
.inline-number { display: inline-flex !important; grid-template-columns: 68px auto; align-items: center; gap: .25rem !important; }
.inline-number input { width: 68px; min-height: 36px; padding: .35rem .45rem; text-align: right; }
.allocation-track { height: 12px; margin-top: 1.2rem; overflow: hidden; border-radius: 6px; background: #e8eef3; }
.allocation-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); }
.allocation-track i.is-over { background: var(--red); }
.allocation-warning { margin: .65rem 0 0; font-size: .76rem; }
.danger-text { color: var(--red); }
.budget-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 1rem; }
.budget-row { display: flex !important; align-items: center; justify-content: space-between; gap: .7rem !important; min-height: 58px; border-bottom: 1px solid var(--line); }
.budget-row > span:first-child { display: grid; }
.budget-row strong { font-size: .78rem; }
.budget-row small { font-size: .66rem; }

.filter-group { display: flex; gap: .2rem; padding: .2rem; border: 1px solid var(--line); border-radius: 7px; background: #f5f8fa; }
.filter-group button { border: 0; border-radius: 5px; padding: .4rem .55rem; color: var(--muted); background: transparent; font-size: .7rem; font-weight: 750; cursor: pointer; }
.filter-group button.is-active { color: var(--navy); background: var(--white); box-shadow: 0 2px 6px rgba(6,60,114,.08); }
.table-wrap { width: 100%; overflow-x: auto; }
table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: .78rem; }
th { border-bottom: 1px solid var(--line); padding: .7rem .65rem; color: var(--muted); font-size: .68rem; letter-spacing: .04em; text-align: left; text-transform: uppercase; white-space: nowrap; }
td { border-bottom: 1px solid #edf1f4; padding: .8rem .65rem; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.number { text-align: right; white-space: nowrap; }
.amount.income { color: var(--green); }
.amount.expense { color: var(--red); }
.amount.saving { color: var(--blue); }
.muted { color: var(--muted); }
.type-label.income { color: var(--green); background: var(--green-bg); }
.type-label.expense { color: var(--red); background: var(--red-bg); }
.type-label.saving { color: var(--blue); background: var(--sky); }
.row-actions { display: flex; gap: .35rem; }
.row-actions button, .table-action { border: 0; padding: .3rem; color: var(--blue); background: transparent; font-size: .72rem; font-weight: 750; cursor: pointer; }
.row-actions button:last-child { color: var(--red); }
.year-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .7rem; }

dialog {

@media (max-width: 1180px) {

}

@media (max-width: 960px) {

  .admin-split { grid-template-columns: 1fr; }

@media (max-width: 720px) {

  .form-grid, .budget-list { grid-template-columns: 1fr; }
  .budget-layout { grid-template-columns: 1fr; }
  .year-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .result-column > .panel { grid-column: auto; grid-row: auto; }
  .plan-cards { grid-template-columns: 1fr; }
  .panel-head { align-items: stretch; flex-direction: column; }
  .panel-head .search-input { width: 100%; }
  .filter-group { overflow-x: auto; }
  .action-links { grid-template-columns: 1fr; }
  .code-field { grid-template-columns: 1fr; }

  .type-switch { display: grid; grid-template-columns: repeat(3, 1fr); }

}

@media (prefers-reduced-motion: reduce) {

}

/* calculator-logic.mjs */
function numberValue(value) {
  if (typeof value === "number") return Number.isFinite(value) ? value : 0;
  const normalized = String(value ?? "").replace(/[^0-9,-]/g, "").replaceAll(".", "").replace(",", ".");
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function roundUp(value, step = 1) {
  const safeStep = Math.max(numberValue(step), 1);
  return value <= 0 ? 0 : Math.ceil(value / safeStep) * safeStep;
}

function roundDown(value, step = 1) {
  const safeStep = Math.max(numberValue(step), 1);
  return value <= 0 ? 0 : Math.floor(value / safeStep) * safeStep;
}

function calculateBusiness(template, input) {
  const playbook = calculatorPlaybook(template);
  const directCosts = (input.directCosts || []).map(item => numberValue(item?.value ?? item));
  const supportInputs = (input.supportInputs || []).map(item => numberValue(item?.value ?? item));
  const additionalSupportCosts = (input.additionalSupportCosts || []).map(item => numberValue(item?.value ?? item));
  const directTotal = directCosts.reduce((sum, value) => sum + Math.max(value, 0), 0);
  const additionalSupportTotal = additionalSupportCosts.reduce((sum, value) => sum + Math.max(value, 0), 0);
  const supportTotal = supportInputs.slice(0, 4).reduce((sum, value) => sum + Math.max(value, 0), 0) + additionalSupportTotal;
  const capacityRaw = Math.max(supportInputs[4] || 0, 0);
  const capacity = Math.max(capacityRaw, 1);
  const targetMargin = Math.max(numberValue(input.targetMargin), 0);
  const fee = Math.max(numberValue(input.fee), 0);
  const tax = Math.max(numberValue(input.tax), 0);
  const discount = Math.min(Math.max(numberValue(input.discount), 0), 0.95);
  const fixedCost = Math.max(numberValue(input.fixedCost), 0);
  const targetProfit = Math.max(numberValue(input.targetProfit), 0);
  const targetVolume = Math.max(numberValue(input.targetVolume), 0);
  const rounding = Math.max(numberValue(input.rounding), 1);
  const marketLow = Math.max(numberValue(input.marketLow), 0);
  const marketHigh = Math.max(numberValue(input.marketHigh), 0);

  const allocatedCost = template.costModel === "time"
    ? directTotal + (Math.max(supportInputs[0] || 0, 0) + Math.max(supportInputs[1] || 0, 0)) * Math.max(supportInputs[2] || 0, 0) + Math.max(supportInputs[3] || 0, 0) + Math.max(supportInputs[4] || 0, 0) + additionalSupportTotal
    : directTotal + supportTotal / capacity;

  const denominator = 1 - targetMargin - fee - tax;
  const suggestedBeforeRounding = denominator > 0 ? allocatedCost / denominator : 0;
  const suggestedPrice = roundUp(suggestedBeforeRounding, rounding);
  const promoPrice = template.promoRound === "up"
    ? roundUp(suggestedPrice * (1 - discount), rounding)
    : roundDown(suggestedPrice * (1 - discount), rounding);
  const unitProfit = suggestedPrice * (1 - fee - tax) - allocatedCost;
  const promoUnitProfit = promoPrice * (1 - fee - tax) - allocatedCost;
  const contribution = ["daily", "monthly"].includes(template.fixedModel)
    ? suggestedPrice * (1 - fee - tax) - directTotal
    : unitProfit;
  const fixedTotal = template.fixedModel === "daily"
    ? fixedCost + supportTotal * targetVolume / capacity
    : template.fixedModel === "monthly"
      ? fixedCost + supportTotal
      : fixedCost;
  const revenue = suggestedPrice * targetVolume;
  const variableTotal = revenue - contribution * targetVolume;
  const monthlyProfit = contribution * targetVolume - fixedTotal;
  const reconciliationDifference = revenue - variableTotal - fixedTotal - monthlyProfit;
  const bep = contribution > 0 ? Math.ceil(fixedTotal / contribution) : 0;
  const volumeForTarget = contribution > 0 ? Math.ceil((fixedTotal + targetProfit) / contribution) : 0;
  const targetGap = targetVolume - volumeForTarget;
  const actualMargin = suggestedPrice > 0 ? unitProfit / suggestedPrice : 0;
  const contributionRate = suggestedPrice > 0 ? contribution / suggestedPrice : 0;
  const safetyMargin = targetVolume > 0 ? (targetVolume - bep) / targetVolume : -1;
  const costValues = [...directCosts, ...supportInputs.slice(0, 4), ...additionalSupportCosts];
  const costCompleteness = costValues.length ? costValues.filter(value => value > 0).length / costValues.length : 0;

  const issues = [];
  if (allocatedCost <= 0) issues.push("Isi minimal satu komponen biaya.");
  if (targetVolume <= 0) issues.push("Target volume harus lebih dari nol.");
  if (template.costModel !== "time" && capacityRaw <= 0) issues.push("Jumlah hasil atau kapasitas pembagi harus lebih dari nol.");
  if (denominator <= 0) issues.push("Total margin, fee, dan pajak harus di bawah 100%.");
  if (targetMargin > 0.95 || fee > 0.95 || tax > 0.95) issues.push("Margin, fee, dan pajak masing-masing tidak boleh melebihi 95%.");
  if (promoUnitProfit <= 0 && suggestedPrice > 0) issues.push("Diskon membuat keuntungan per transaksi tidak positif.");
  if (marketLow > 0 && marketHigh > 0 && marketLow > marketHigh) issues.push("Harga pembanding terendah tidak boleh melebihi harga tertinggi.");
  if (![allocatedCost, suggestedPrice, promoPrice, contribution, fixedTotal, revenue, variableTotal, monthlyProfit].every(Number.isFinite)) issues.push("Angka terlalu besar untuk dihitung secara presisi.");

  const warnings = [];
  if (costCompleteness < 0.65) warnings.push("Masih banyak komponen biaya bernilai nol; periksa agar biaya pokok tidak terlalu rendah.");
  if (fixedCost <= 0) warnings.push("Biaya tetap bulanan belum diisi.");
  if (targetProfit <= 0) warnings.push("Target laba operasional belum diisi.");
  if (targetMargin > 0.8) warnings.push("Target margin di atas 80% perlu divalidasi dengan harga pasar dan nilai yang diterima pelanggan.");
  if (fee + tax > 0.35) warnings.push("Fee dan pajak menyerap lebih dari 35% harga; periksa kembali dasar persentasenya.");
  if (suggestedBeforeRounding > 0 && rounding > suggestedBeforeRounding * 0.25) warnings.push("Kelipatan pembulatan terlalu besar dibanding harga sebelum pembulatan.");

  const marketCheck = marketLow > 0 && marketHigh > 0 && marketLow <= marketHigh
    ? suggestedPrice < marketLow
      ? { tone: "warning", detail: `Harga rekomendasi berada ${Math.round((1 - suggestedPrice / marketLow) * 100)}% di bawah batas bawah pembanding lokal.` }
      : suggestedPrice > marketHigh
        ? { tone: "warning", detail: `Harga rekomendasi berada ${Math.round((suggestedPrice / marketHigh - 1) * 100)}% di atas batas atas pembanding lokal; pastikan nilai premium dapat dijelaskan.` }
        : { tone: "good", detail: `Harga rekomendasi berada dalam rentang pembanding ${marketLow.toLocaleString("id-ID")}–${marketHigh.toLocaleString("id-ID")} rupiah.` }
    : marketLow > 0 || marketHigh > 0
      ? { tone: "warning", detail: "Lengkapi batas bawah dan batas atas harga pembanding agar posisi harga dapat dinilai." }
      : { tone: "warning", detail: "Belum ada pembanding harga lokal. Isi minimal tiga referensi pasar sebelum uji penawaran." };

  const marginScenarios = [
    { key: "hemat", label: "Margin lebih rendah", margin: Math.max(0, targetMargin - 0.1) },
    { key: "target", label: "Target", margin: targetMargin },
    { key: "premium", label: "Premium", margin: Math.min(0.8, targetMargin + 0.1) },
  ].map(item => {
    const scenarioDenominator = 1 - item.margin - fee - tax;
    const price = scenarioDenominator > 0 ? roundUp(allocatedCost / scenarioDenominator, rounding) : 0;
    const scenarioUnitProfit = price * (1 - fee - tax) - allocatedCost;
    const scenarioContribution = ["daily", "monthly"].includes(template.fixedModel)
      ? price * (1 - fee - tax) - directTotal
      : scenarioUnitProfit;
    return {
      ...item,
      price,
      unitProfit: scenarioUnitProfit,
      bep: scenarioContribution > 0 ? Math.ceil(fixedTotal / scenarioContribution) : 0,
      profit: scenarioContribution * targetVolume - fixedTotal,
    };
  });

  const volumeScenarios = [
    { key: "conservative", label: "Konservatif", volume: Math.max(1, Math.round(targetVolume * 0.7)) },
    { key: "target", label: "Target", volume: Math.max(1, Math.round(targetVolume)) },
    { key: "optimistic", label: "Optimistis", volume: Math.max(1, Math.round(targetVolume * 1.3)) },
  ].map(item => {
    const scenarioRevenue = item.volume * suggestedPrice;
    const perUnitVariable = ["daily", "monthly"].includes(template.fixedModel)
      ? directTotal + suggestedPrice * (fee + tax)
      : allocatedCost + suggestedPrice * (fee + tax);
    const scenarioVariable = item.volume * perUnitVariable;
    const scenarioFixed = template.fixedModel === "daily" ? fixedCost + supportTotal * item.volume / capacity : fixedTotal;
    return { ...item, revenue: scenarioRevenue, variable: scenarioVariable, fixed: scenarioFixed, profit: scenarioRevenue - scenarioVariable - scenarioFixed };
  });

  const checks = [
    {
      key: "inputs",
      label: "Input dapat dihitung",
      tone: issues.length ? "danger" : "good",
      detail: issues.length ? issues.join(" ") : "Biaya, volume, margin, fee, dan pajak menghasilkan perhitungan yang valid.",
    },
    {
      key: "reconciliation",
      label: "Rekonsiliasi laba",
      tone: Math.abs(reconciliationDifference) < 0.01 ? "good" : "danger",
      detail: Math.abs(reconciliationDifference) < 0.01
        ? "Omzet dikurangi biaya variabel dan biaya tetap sama dengan laba proyeksi."
        : "Komponen laba belum seimbang; periksa kembali angka yang terlalu besar.",
    },
    {
      key: "costs",
      label: "Kelengkapan biaya",
      tone: costCompleteness >= 0.75 ? "good" : costCompleteness >= 0.5 ? "warning" : "danger",
      detail: `${Math.round(costCompleteness * 100)}% komponen biaya sudah berisi nominal di atas nol.`,
    },
    {
      key: "bep",
      label: "Target melewati BEP",
      tone: targetVolume >= bep && bep > 0 ? "good" : "danger",
      detail: bep > 0 ? `Target ${numberValue(targetVolume).toLocaleString("id-ID")} ${playbook.unit}; BEP ${numberValue(bep).toLocaleString("id-ID")} ${playbook.unit}.` : "BEP belum dapat dihitung.",
    },
    {
      key: "buffer",
      label: "Bantalan di atas BEP",
      tone: safetyMargin >= playbook.minimumBuffer ? "good" : safetyMargin >= 0 ? "warning" : "danger",
      detail: safetyMargin >= 0 ? `${Math.round(safetyMargin * 100)}% target penjualan berada di atas titik impas; acuan profil ini minimal ${Math.round(playbook.minimumBuffer * 100)}%.` : "Target penjualan masih berada di bawah titik impas.",
    },
    {
      key: "profit",
      label: "Target laba tercapai",
      tone: targetGap >= 0 && volumeForTarget > 0 ? "good" : "warning",
      detail: volumeForTarget > 0 ? `Dibutuhkan ${numberValue(volumeForTarget).toLocaleString("id-ID")} ${playbook.unit} untuk mencapai target laba.` : "Target laba belum dapat dihitung.",
    },
    {
      key: "promo",
      label: "Harga promo tetap positif",
      tone: promoUnitProfit > 0 ? "good" : "danger",
      detail: promoUnitProfit > 0 ? `Sisa setelah biaya pada harga promo: ${Math.round(promoUnitProfit).toLocaleString("id-ID")} rupiah per ${playbook.unit}.` : "Diskon menghabiskan seluruh keuntungan per transaksi.",
    },
    {
      key: "market",
      label: "Harga sesuai konteks pasar",
      tone: marketCheck.tone,
      detail: marketCheck.detail,
    },
  ];
  const dangerCount = checks.filter(item => item.tone === "danger").length;
  const warningCount = checks.filter(item => item.tone === "warning").length + warnings.length;
  const assessment = dangerCount
    ? { label: "Belum aman diuji", tone: "danger", summary: "Perbaiki komponen merah sebelum memakai angka ini sebagai dasar uji pasar." }
    : warningCount
      ? { label: "Perlu penyesuaian", tone: "warning", summary: "Hitungan dapat digunakan sebagai skenario awal, tetapi bagian kuning masih perlu divalidasi." }
      : { label: "Siap diuji", tone: "good", summary: "Hitungan internal konsisten dan dapat dibawa ke uji pasar skala kecil." };

  return {
    valid: issues.length === 0,
    issues,
    warnings,
    playbook,
    checks,
    assessment,
    directTotal,
    supportTotal,
    allocatedCost,
    suggestedBeforeRounding,
    suggestedPrice,
    promoPrice,
    unitProfit,
    promoUnitProfit,
    contribution,
    fixedTotal,
    revenue,
    variableTotal,
    monthlyProfit,
    reconciliationDifference,
    bep,
    volumeForTarget,
    targetGap,
    actualMargin,
    contributionRate,
    safetyMargin,
    costCompleteness,
    marketLow,
    marketHigh,
    marketCheck,
    marginScenarios,
    volumeScenarios,
  };
}

function cloneTemplateInput(template) {
  return {
    businessName: template.businessName,
    offer: template.offer,
    location: "",
    businessScale: "micro",
    salesChannel: "offline",
    marketLow: 0,

  };
}

function loadSaved() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    saved = parsed.values && typeof parsed.values === "object" ? parsed.values : {};
    activeId = CALCULATOR_TEMPLATES.some(item => item.id === parsed.activeId) ? parsed.activeId : activeId;
    const allowedCategories = [PRIORITY_CATEGORY, ...CALCULATOR_CATEGORIES];
    const currentTemplate = CALCULATOR_TEMPLATES.find(item => item.id === activeId);
    activeCategory = allowedCategories.includes(parsed.activeCategory)
      ? parsed.activeCategory
      : PRIORITY_CALCULATOR_IDS.has(activeId) ? PRIORITY_CATEGORY : currentTemplate?.category || PRIORITY_CATEGORY;
  } catch { saved = {}; }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ activeId, activeCategory, values: saved }));
    const badge = document.querySelector(".autosave-pill");
    if (badge) { badge.classList.remove("save-failed"); badge.innerHTML = '<i></i><div><strong>Tersimpan otomatis</strong><small>di perangkat ini</small></div>'; }
    return true;
  } catch {
    const badge = document.querySelector(".autosave-pill");
    if (badge) { badge.classList.add("save-failed"); badge.innerHTML = '<div><strong>Belum tersimpan</strong><small>Periksa ruang atau izin browser</small></div>'; }
    notify("Hitungan masih berupa draf. Penyimpanan perangkat gagal; data yang sudah tersimpan tetap ada.");
    return false;
  }
}

function template() {
  return CALCULATOR_TEMPLATES.find(item => item.id === activeId) || CALCULATOR_TEMPLATES[0];
}

function normalizeCostItems(candidate, fallback, prefix, limit = 20) {
  const source = Array.isArray(candidate) ? candidate : [];
  const base = Array.isArray(fallback) ? fallback : [];
  const size = Math.min(Math.max(source.length, base.length), limit);
  return Array.from({ length: size }, (_, index) => {
    const savedItem = source[index];
    const fallbackItem = base[index] || {};
    const savedObject = savedItem && typeof savedItem === "object";
    const label = savedObject ? savedItem.label : fallbackItem.label;
    const value = savedObject ? savedItem.value : savedItem;
    return {
      id: String(savedObject && savedItem.id ? savedItem.id : `${prefix}-${index + 1}`).slice(0, 80),
      label: String(label || `${prefix === "direct" ? "Biaya langsung" : "Biaya pendukung"} ${index + 1}`).trim().slice(0, 80),
      value: numberValue(value ?? fallbackItem.value ?? 0),
    };
  });
}

function inputFor(item = template()) {
  if (!saved[item.id]) saved[item.id] = cloneTemplateInput(item);
  const base = cloneTemplateInput(item);
  const current = saved[item.id] || {};
  const normalized = {
    ...base,
    ...current,
    directCosts: normalizeCostItems(current.directCosts, base.directCosts, "direct"),
    supportInputs: normalizeCostItems(current.supportInputs, base.supportInputs, "support", 5).slice(0, 5),
    additionalSupportCosts: normalizeCostItems(current.additionalSupportCosts, [], "additional-support"),
  };
  const legacyTimeLabels = new Set(["Proyek dalam periode biaya", "Klien dalam periode biaya", "Sesi dalam periode biaya"]);
  if (item.costModel === "time" && legacyTimeLabels.has(normalized.supportInputs[4]?.label)) {
    normalized.supportInputs[4].label = base.supportInputs[4].label;
  }
  return saved[item.id] = normalized;
}

function renderCalculator() {
  if (!calcDollar("#calculator-list")) return;

}

function setNested(input, key, value) {
  const [name, index, property] = key.split(".");
  if (index !== undefined && property) {
    const target = input[name]?.[Number(index)];
    if (!target) return;
    target[property] = property === "label" ? String(value).trimStart().slice(0, 80) : numberValue(value);
  }
  else if (index !== undefined) input[name][Number(index)] = numberValue(value);
  else if (["businessName", "offer", "location", "marketSource"].includes(name)) input[name] = String(value).trimStart().slice(0, 80);
  else if (["businessScale", "salesChannel"].includes(name)) input[name] = String(value).slice(0, 40);
  else if (["targetMargin", "fee", "discount", "tax"].includes(name)) input[name] = Math.max(numberValue(value), 0) / 100;
  else input[name] = numberValue(value);
}

function initCalculator(options = {}) {
  notify = options.showToast || notify;
  loadSaved();
  renderCalculator();
  const calculatorSteps = [...document.querySelectorAll(".calculator-step")];
  calculatorSteps.forEach((step, index) => {
    const controls = document.createElement("div");
    controls.className = "calculator-step-navigation";
    controls.innerHTML = index < calculatorSteps.length - 1 ? '<button class="btn secondary" type="button">Lanjut ke langkah ' + (index + 2) + '</button>' : '<button class="btn primary" type="button">Lihat hasil</button>';
    step.append(controls);
    controls.querySelector("button")?.addEventListener("click", () => {
      if (index === calculatorSteps.length - 1) {
        document.querySelector(".calculator-results").scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      step.open = false;
      calculatorSteps[index + 1].open = true;
      calculatorSteps[index + 1].querySelector("summary").focus();
      calculatorSteps[index + 1].scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  calcDollar("#calculator-search").addEventListener("input", event => {
    searchQuery = event.target.value;
    if (searchQuery.trim()) activeCategory = "Semua";
    renderCatalog();
  });
  calcDollar("#calculator-category-select").addEventListener("change", event => {
    activeCategory = event.target.value;
    persist();
    renderCatalog();
  });
  calcDollar("#calculator-categories").addEventListener("click", event => {
    const button = event.target.closest("[data-calculator-category]");
    if (!button) return;
    activeCategory = button.dataset.calculatorCategory;
    persist();
    renderCatalog();
  });
  calcDollar("#calculator-list").addEventListener("click", event => {
    const button = event.target.closest("[data-calculator-id]");
    if (!button) return;
    activeId = button.dataset.calculatorId;
    persist();
    renderCalculator();
    if (!window.matchMedia("(min-width: 1181px)").matches) calcDollar("#calculator-catalog").open = false;
    calcDollar(".calculator-workspace")?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  calcDollar("#calculator-form").addEventListener("input", event => {
    const control = event.target.closest("[data-calc-field]");
    if (!control) return;
    setNested(inputFor(), control.dataset.calcField, control.value);
    persist();
    if (control.dataset.calcField === "offer") calcDollar("#calculator-offer-copy").textContent = control.value;
    renderResults();
  });
  calcDollar("#calculator-form").addEventListener("click", event => {
    const addButton = event.target.closest("[data-add-cost]");
    if (addButton) {
      const group = addButton.dataset.addCost;
      const values = inputFor();
      if (!Array.isArray(values[group]) || values[group].length >= 20) return notify("Maksimal 20 komponen biaya untuk bagian ini.");
      const number = values[group].length + 1;
      values[group].push({ id: `${group}-${Date.now()}`, label: group === "directCosts" ? `Biaya langsung tambahan ${number}` : `Biaya pendukung tambahan ${number}`, value: 0 });
      persist();
      renderForm();
      renderResults();
      requestAnimationFrame(() => calcDollar(`[data-calc-field="${group}.${number - 1}.label"]`)?.select());
      notify("Komponen biaya ditambahkan. Ubah nama dan nominalnya sesuai kebutuhan.");
      return;
    }
    const removeButton = event.target.closest("[data-remove-cost]");
    if (!removeButton) return;
    const group = removeButton.dataset.removeCost;
    const index = Number(removeButton.dataset.costIndex);
    const values = inputFor();
    if (!Array.isArray(values[group]) || !values[group][index]) return;
    if (group === "directCosts" && index < template().defaults.directCosts.length) return;
    values[group].splice(index, 1);
    persist();
    renderForm();
    renderResults();
    notify("Komponen biaya dihapus.");
  });
  calcDollar("#calculator-form").addEventListener("focusout", event => {
    const control = event.target.closest("[data-calc-field]");
    if (!control || control.tagName === "SELECT" || control.dataset.calcField.endsWith(".label") || ["businessName", "offer", "location", "marketSource", "targetMargin", "fee", "discount", "tax"].includes(control.dataset.calcField)) return;
    control.value = inputNumber(numberValue(control.value));
  });
  calcDollar("#calculator-reset").addEventListener("click", () => {
    saved[activeId] = cloneTemplateInput(template());
    persist();
    renderCalculator();
    notify("Angka contoh kalkulator dikembalikan.");
  });
  const desktopCatalog = window.matchMedia("(min-width: 1181px)");
  const syncCatalog = () => { if (desktopCatalog.matches) calcDollar("#calculator-catalog").open = true; };
  if (!desktopCatalog.matches) calcDollar("#calculator-catalog").open = false;
  desktopCatalog.addEventListener?.("change", syncCatalog);
}

function calculatorToolDefinitions() {
  return [
    {
      name: "list_business_calculators",
      title: "Daftar kalkulator usaha",
      description: "Menampilkan 50 kalkulator bisnis SBB dan satu kalkulator fleksibel.",
      inputSchema: { type: "object", properties: { category: { type: "string" }, query: { type: "string" } }, additionalProperties: false },
      annotations: { readOnlyHint: true, untrustedContentHint: false },
      execute(input = {}) {
        const query = String(input.query || "").toLowerCase();
        return CALCULATOR_TEMPLATES.filter(item => (!input.category || input.category === "Semua" || item.category === input.category) && (!query || `${item.title} ${item.offer}`.toLowerCase().includes(query))).map(item => ({ id: item.id, name: item.title, category: item.category }));
      },
    },
    {
      name: "calculate_business_price",
      title: "Hitung harga dan BEP usaha",
      description: "Menghitung harga jual, laba, BEP, dan volume target dari salah satu template bisnis SBB.",
      inputSchema: { type: "object", properties: { business_id: { type: "string" }, target_margin_percent: { type: "number", minimum: 0, maximum: 95 }, fixed_cost: { type: "number", minimum: 0 }, target_profit: { type: "number", minimum: 0 }, target_volume: { type: "number", exclusiveMinimum: 0 }, fee_percent: { type: "number", minimum: 0, maximum: 95 }, tax_percent: { type: "number", minimum: 0, maximum: 95 }, discount_percent: { type: "number", minimum: 0, maximum: 95 }, direct_costs: { type: "array", items: { type: "number", minimum: 0 }, maxItems: 20 }, support_inputs: { type: "array", items: { type: "number", minimum: 0 }, maxItems: 5 } }, required: ["business_id"], additionalProperties: false },
      annotations: { readOnlyHint: true, untrustedContentHint: false },
      execute(input = {}) {
        const item = CALCULATOR_TEMPLATES.find(template => template.id === input.business_id);
        if (!item) throw new Error("Kalkulator bisnis tidak ditemukan.");
        const values = cloneTemplateInput(item);
        if (input.target_margin_percent !== undefined) values.targetMargin = input.target_margin_percent / 100;
        if (input.fixed_cost !== undefined) values.fixedCost = input.fixed_cost;
        if (input.target_profit !== undefined) values.targetProfit = input.target_profit;
        if (input.target_volume !== undefined) values.targetVolume = input.target_volume;
        if (input.fee_percent !== undefined) values.fee = input.fee_percent / 100;
        if (input.tax_percent !== undefined) values.tax = input.tax_percent / 100;
        if (input.discount_percent !== undefined) values.discount = input.discount_percent / 100;
        if (input.direct_costs) values.directCosts = values.directCosts.map((cost, index) => ({ ...cost, value: input.direct_costs[index] ?? cost.value }));
        if (input.support_inputs) values.supportInputs = values.supportInputs.map((cost, index) => ({ ...cost, value: input.support_inputs[index] ?? cost.value }));
        const result = calculateBusiness(item, values);
        return { business: item.title, price: result.suggestedPrice, monthly_profit: result.monthlyProfit, bep: result.bep, volume_for_target_profit: result.volumeForTarget, actual_margin_percent: result.actualMargin * 100, issues: result.issues };
      },
    },
  ];
}
