<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" id="site-theme-color" content="#063c72">
  <meta name="description" content="SBB membantu mengatur uang, menghitung kesiapan modal, dan merencanakan langkah menuju bisnis.">
  <title>SBB - Siap Buka Bisnis</title>
  <link rel="manifest" id="site-manifest" href="./manifest.webmanifest">
  <link rel="icon" id="site-favicon" href="./icon-192.png">
  <link rel="apple-touch-icon" id="site-apple-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=26">
  <link rel="stylesheet" href="./redesign.css?v=26">
  <style>
    .boot-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;color:#063c72;background:#f4f7fa;text-align:center}
    .boot-fallback div{max-width:520px}.boot-fallback strong{display:block;margin-bottom:8px;font-size:20px}.boot-fallback small{color:#66788a}
  </style>
</head>
<body>
  <noscript>Aplikasi ini memerlukan JavaScript untuk menghitung dan menyimpan data di perangkat.</noscript>
  <div id="app">
    <section class="boot-fallback" id="boot-fallback">
      <div><strong>Memuat aplikasi…</strong><small>Menyiapkan ruang usahamu.</small></div>
    </section>
  </div>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <div class="dialog-icon">!</div>
      <h2 id="confirm-title">Konfirmasi tindakan</h2>
      <p id="confirm-copy">Tindakan ini akan mengubah data.</p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel">Batal</button>
        <button class="btn danger" id="confirm-action" value="confirm">Lanjutkan</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script>
    (() => {
      window.setTimeout(() => {
        const fallback = document.getElementById("boot-fallback");
        if (!fallback) return;
        fallback.innerHTML = '<div><strong>Aplikasi belum berhasil dimuat.</strong><small>Periksa koneksi lalu muat ulang. Data tersimpan tidak dihapus.</small><br><button id="boot-reload" style="margin-top:16px;padding:10px 16px;border:0;border-radius:8px;color:#fff;background:#0255a5;font-weight:700;cursor:pointer">Muat ulang</button></div>';
        document.getElementById("boot-reload").addEventListener("click", () => location.reload());
      }, 8000);
    })();
  </script>
  <script type="module" src="./app.mjs?v=26"></script>
</body>
</html>
